name: Validate

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: PowerShell and JavaScript tests
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install PowerShell test modules
        shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module Pester -RequiredVersion 5.7.1 -Scope CurrentUser -Force -SkipPublisherCheck
          Install-Module PSScriptAnalyzer -MinimumVersion 1.22.0 -Scope CurrentUser -Force
          Install-Module Microsoft.Graph.Authentication -RequiredVersion 2.38.1 -Scope CurrentUser -Force

      - name: Scan public source
        shell: pwsh
        run: |
          .\tools\Test-IdentityAtlasRelease.ps1

      - name: Run build
        shell: pwsh
        run: |
          .\build.ps1 -NodePath (Get-Command node -ErrorAction Stop).Source

      - name: Build clean release package
        shell: pwsh
        run: |
          .\tools\New-IdentityAtlasRelease.ps1 `
            -OutputPath .\Release `
            -NodePath (Get-Command node -ErrorAction Stop).Source `
            -SkipTests

      - name: Test public release security boundary
        shell: pwsh
        run: |
          .\tools\Test-IdentityAtlasPublicRelease.ps1 `
            -ReleasePath .\Release\IdentityAtlas-v0.16.0-preview.1.zip `
            -SkipHistory

      - name: Build and test PowerShell Gallery package
        shell: pwsh
        run: |
          .\tools\New-IdentityAtlasGalleryPackage.ps1 `
            -OutputPath .\Gallery `
            -ReleasePath .\Release\IdentityAtlas-v0.16.0-preview.1.zip
